name: BDD Suite

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  bdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install BDD dependencies
        run: pip install -r bdd/requirements.txt
      - name: Run BDD suite
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE_URL: ${{ secrets.LLM_API_BASE_URL }}
          LLM_REQUEST_COMMAND: "bash scripts/bdd/ohmyopencode.sh"
        run: behave bdd/features
